name: publish

# main への push（PR のマージ）で Docker イメージをビルドし、GitHub Container Registry にプッシュする。
# イメージに入るもの（Dockerfile が COPY するもの）が変わったときだけ動く。ドキュメントだけの変更で新しいバージョンを作ると、
# 古いバージョンを消す（直近の KEEP_VERSIONS 個だけ残す）ときに、中身の違う意味のあるバージョンが押し出されるため
on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "nginx/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

# プッシュは並行させない（実行中のものは止めずに待つ）
concurrency:
  group: publish
  cancel-in-progress: false

env:
  # 残しておくイメージのバージョンの数。直近のものだけ残す
  KEEP_VERSIONS: 5

jobs:
  push:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # イメージ名は小文字にする（リポジトリ名は MyFontStudio だが、GHCR の名前は小文字だけ）
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # タグ：main（いつも最新）と sha-<コミットの先頭 7 文字>。ラベルにリポジトリの URL などを入れ、パッケージをリポジトリに結び付ける
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # provenance などの添付を付けない（タグのないバージョンが増え、容量を使うため）
          provenance: false
          sbom: false
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### プッシュしたイメージ'
            echo '```'
            echo "$TAGS"
            echo "digest: $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # プッシュしたイメージの既知の脆弱性を調べる。修正済みの CRITICAL があれば失敗にして知らせる（ベースイメージの更新で直る）
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [ push ]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.push.outputs.image }}@${{ needs.push.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy.txt
      - name: Summary
        if: always()
        run: |
          {
            echo '### イメージの脆弱性（修正済みの CRITICAL・HIGH）'
            echo '```'
            cat trivy.txt 2>/dev/null || echo "（結果がない）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.push.outputs.image }}@${{ needs.push.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  # 古いバージョンを消して、直近の KEEP_VERSIONS 個だけ残す（main のタグが付いた最新のものは必ず残る）
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [ push ]
    permissions:
      packages: write
    steps:
      - name: Package name
        id: package
        env:
          NAME: ${{ github.event.repository.name }}
        run: echo "name=${NAME,,}" >> "$GITHUB_OUTPUT"
      - name: Delete old image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ steps.package.outputs.name }}
          package-type: container
          min-versions-to-keep: ${{ env.KEEP_VERSIONS }}
