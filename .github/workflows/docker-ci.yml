name: docker-ci

on: [ pull_request ]

permissions:
  contents: read

# 同じ PR で新しく push されたら、古い実行は止める
concurrency:
  group: docker-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: myfontstudio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Render と同じく PORT を渡して起動する
      - name: Run container
        run: |
          docker run -d --name app -e PORT=10000 -p 10000:10000 myfontstudio:ci
          # 30 秒たっても /healthz が返らなければ、ここで失敗にする（E2E の分かりにくい失敗にしない）
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:10000/healthz && exit 0
            sleep 1
          done
          echo "::error::コンテナが起動しませんでした"
          docker logs app
          exit 1
      # 応答とヘッダー、ブラウザでの操作を確かめる
      - name: Run end-to-end tests
        env:
          BASE_URL: http://localhost:10000
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Show container logs
        if: always()
        run: docker logs app
