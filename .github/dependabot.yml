version: 2
# 週 1 回、エコシステムごとに minor・patch を 1 つの PR にまとめる（major は 1 件ずつ PR にする）
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint が TypeScript 7 に対応するまで 6.0 系にとどめる
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "pip"
    directory: "/frontend/scripts"
    schedule:
      interval: "weekly"
    groups:
      fontcheck:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    groups:
      e2e:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # node のベースイメージは frontend/.node-version と一緒に手で上げる
    ignore:
      - dependency-name: "node"
      # Nginx は安定版（偶数のマイナー：1.30, 1.32 …）を使う。奇数のマイナー（1.31 など）は開発版（mainline）なので、
      # マイナー・メジャーの更新は受けず、同じ安定版のダイジェストとパッチの更新だけ受ける。次の安定版には手で上げる
      - dependency-name: "nginxinc/nginx-unprivileged"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
